---
- name: dconf update
  ansible.builtin.command: dconf update
  become: true

- name: restart demo app
  ansible.builtin.command:
    cmd: systemctl --user -M {{ kiosk_user }}@ restart {{ app_name }}.service
  become: true
  register: restart_demo_app_result
  changed_when: restart_demo_app_result.rc == 0
  failed_when: false

- name: reload kiosk extension
  ansible.builtin.shell: |
    set -e
    uid=$(id -u {{ kiosk_user }})
    export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${uid}/bus"
    runuser -u {{ kiosk_user }} -- gnome-extensions disable '{{ extension_uuid }}' || true
    runuser -u {{ kiosk_user }} -- gnome-extensions enable '{{ extension_uuid }}'
  args:
    executable: /bin/bash
  become: true
  changed_when: true
  failed_when: false
