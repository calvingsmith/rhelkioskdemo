---
# Full gnome-shell kiosk provisioning (replaces scripts/provision-vm-shell.sh).
# gnome-kiosk (scripts/provision-vm.sh) is intentionally untouched/separate —
# see CLAUDE.md "gnome-shell kiosk build" section for why the two builds
# must never be able to affect each other.

- name: Install required packages
  ansible.builtin.dnf:
    name:
      - gnome-shell
      - gdm
      - gtk4
      - dconf
      - gnome-remote-desktop
      - openssl
      - seahorse
    state: present
  become: true

- name: Create kiosk user
  ansible.builtin.user:
    name: "{{ kiosk_user }}"
    shell: /bin/bash
    password: "{{ lookup('pipe', 'openssl passwd -6 ' ~ kiosk_password) }}"
    state: present
  become: true

- name: Configure AccountsService session for kiosk user
  ansible.builtin.template:
    src: accountsservice-user.j2
    dest: "/var/lib/AccountsService/users/{{ kiosk_user }}"
    mode: "0644"
  become: true

- name: Create kiosk user directories
  ansible.builtin.file:
    path: "/home/{{ kiosk_user }}/{{ item }}"
    state: directory
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
  become: true
  loop:
    - .local
    - .config
    - .local/bin
    - .local/share
    - .local/share/gnome-shell
    - .local/share/gnome-shell/extensions
    - .config/gnome-kiosk-demo
    - .config/systemd/user
    - .config/systemd/user/graphical-session.target.wants

- name: Copy demo app binary
  ansible.builtin.copy:
    src: "{{ app_bin_local }}"
    dest: "/home/{{ kiosk_user }}/.local/bin/{{ app_name }}"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
  become: true

- name: Remove stale extension directory before re-copying
  # scp/cp -r into an already-existing destination nests instead of
  # replacing (the bug that cost a whole debugging session on 2026-07-22
  # with the bash-heredoc version of this provisioning) — Ansible's copy
  # module normally avoids this, but the directory is still removed first
  # for a guaranteed-clean state on every run.
  ansible.builtin.file:
    path: "/home/{{ kiosk_user }}/.local/share/gnome-shell/extensions/{{ extension_uuid }}"
    state: absent
  become: true

- name: Copy Kiosk Layout Helper extension
  ansible.builtin.copy:
    src: "{{ extension_dir_local }}/"
    dest: "/home/{{ kiosk_user }}/.local/share/gnome-shell/extensions/{{ extension_uuid }}/"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
  become: true

- name: Write remote-access credentials env file
  ansible.builtin.template:
    src: remote-access.env.j2
    dest: "/home/{{ kiosk_user }}/.config/gnome-kiosk-demo/remote-access.env"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0600"
  become: true

- name: Install remote-access setup script
  ansible.builtin.copy:
    src: remote-access-setup.sh
    dest: "/home/{{ kiosk_user }}/.local/bin/gnomekiosk-remote-access-setup.sh"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
  become: true

- name: Install remote-access-setup systemd user unit
  ansible.builtin.copy:
    src: gnomekiosk-remote-access-setup.service
    dest: "/home/{{ kiosk_user }}/.config/systemd/user/gnomekiosk-remote-access-setup.service"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
  become: true

- name: Install demo-app systemd user unit
  ansible.builtin.template:
    src: gnomekiosk-demo-shell.service.j2
    dest: "/home/{{ kiosk_user }}/.config/systemd/user/{{ app_name }}.service"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
  become: true

- name: Install session focus-guard script
  # Ported from scripts/gnome-kiosk-script.sh's loginctl-activate loop: GDM's
  # greeter can win a session-readiness-timeout race and take seat0 back;
  # this fights to reclaim it. Dropped by accident when the gnome-shell
  # variant moved from a custom launcher script to systemd units — see
  # CLAUDE.md.
  ansible.builtin.copy:
    src: gnomekiosk-session-focus-guard.sh
    dest: "/home/{{ kiosk_user }}/.local/bin/gnomekiosk-session-focus-guard.sh"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"
  become: true

- name: Install session focus-guard systemd user unit
  ansible.builtin.copy:
    src: gnomekiosk-session-focus-guard.service
    dest: "/home/{{ kiosk_user }}/.config/systemd/user/gnomekiosk-session-focus-guard.service"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0644"
  become: true

- name: Enable systemd user units via graphical-session.target.wants symlinks
  ansible.builtin.file:
    src: "../{{ item }}"
    dest: "/home/{{ kiosk_user }}/.config/systemd/user/graphical-session.target.wants/{{ item }}"
    state: link
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    force: true
  become: true
  loop:
    - gnomekiosk-session-focus-guard.service
    - gnomekiosk-remote-access-setup.service
    - "{{ app_name }}.service"

- name: Configure GDM autologin
  ansible.builtin.copy:
    dest: /etc/gdm/custom.conf
    content: |
      # GDM configuration storage

      [daemon]
      AutomaticLoginEnable=True
      AutomaticLogin={{ kiosk_user }}
    mode: "0644"
  become: true

- name: Ensure dconf db directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"
  become: true

- name: Install power/idle dconf settings
  ansible.builtin.copy:
    src: 00-kiosk-power
    dest: /etc/dconf/db/local.d/00-kiosk-power
    mode: "0644"
  become: true
  notify: dconf update

- name: Install kiosk lockdown dconf settings
  ansible.builtin.template:
    src: 01-kiosk-lockdown.j2
    dest: /etc/dconf/db/local.d/01-kiosk-lockdown
    mode: "0644"
  become: true
  notify: dconf update

- name: Flush handlers now so dconf is applied before enable-linger/reboot
  ansible.builtin.meta: flush_handlers

- name: Enable lingering for kiosk user (systemd --user runs without an active login)
  ansible.builtin.command: "loginctl enable-linger {{ kiosk_user }}"
  become: true
  changed_when: false

- name: Open RDP port in firewalld
  ansible.posix.firewalld:
    port: 3389/tcp
    permanent: true
    immediate: true
    state: enabled
  become: true
  ignore_errors: true

- name: Set default target to graphical
  ansible.builtin.command: systemctl set-default graphical.target
  become: true
  changed_when: false

- name: Reboot to apply session/lockdown changes
  ansible.builtin.reboot:
    reboot_timeout: 180
  become: true
